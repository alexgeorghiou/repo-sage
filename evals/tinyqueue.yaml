# Retrieval eval over the bundled sample repository.
# Run with: repo-sage eval evals/tinyqueue.yaml
name: tinyqueue
repo: ../tests/fixtures/sample_repo
ks: [1, 3, 5]
questions:
  - question: How long does a failed job wait before it is retried?
    expected_files: [tinyqueue/retry.py]
  - question: What is jitter used for in the backoff calculation?
    expected_files: [tinyqueue/retry.py]
  - question: Which jobs are dequeued first, high or low priority numbers?
    expected_files: [tinyqueue/queue.py]
  - question: What happens to a job that is dequeued but never acknowledged?
    expected_files: [tinyqueue/queue.py]
  - question: How does the worker shut down gracefully on SIGTERM?
    expected_files: [tinyqueue/worker.py]
  - question: Where do jobs go after they exhaust all retry attempts?
    expected_files: [tinyqueue/worker.py]
  - question: How are jobs persisted to disk so they survive a restart?
    expected_files: [tinyqueue/storage.py]
  - question: How is the append-only log compacted?
    expected_files: [tinyqueue/storage.py]
  - question: Does the scheduler replay missed intervals after a pause?
    expected_files: [tinyqueue/scheduler.py]
  - question: How do I register a periodic job that runs every few seconds?
    expected_files: [tinyqueue/scheduler.py]
  - question: How does the TypeScript client enforce a request timeout?
    expected_files: [client/src/client.ts]
  - question: What fields does a JobRequest have?
    expected_files: [client/src/types.ts]
  - question: How does the health check probe decide the gateway is unhealthy?
    expected_files: [cmd/healthcheck/main.go]
  - question: How do I start a worker from the command line with concurrency?
    expected_files: [README.md, tinyqueue/worker.py]
