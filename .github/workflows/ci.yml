name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint & test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=repo_sage --cov-report=term-missing
      - name: Retrieval eval (fails below MRR 0.7)
        run: repo-sage eval evals/tinyqueue.yaml --min-mrr 0.7

  postgres:
    name: pgvector integration
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sage
          POSTGRES_PASSWORD: sage
          POSTGRES_DB: sage
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sage -d sage"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REPO_SAGE_TEST_DSN: postgresql://sage:sage@localhost:5432/sage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -m postgres -rs

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t repo-sage-api .
      - run: docker build -t repo-sage-web ./web
