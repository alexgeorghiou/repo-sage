[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "repo-sage"
version = "0.1.0"
description = "Chat with any GitHub repository: code-aware chunking, hybrid retrieval and cited answers."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alex Georghiou" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "pathspec>=0.12",
    "gitpython>=3.1.43",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.1", "pgvector>=0.3", "numpy>=1.26"]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
rerank = ["sentence-transformers>=3.0"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "psycopg[binary,pool]>=3.1",
    "numpy>=1.26",
    "pgvector>=0.3",
]

[project.scripts]
repo-sage = "repo_sage.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_sage"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["tests/fixtures", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = ["postgres: requires REPO_SAGE_TEST_DSN pointing at a pgvector-enabled Postgres"]
